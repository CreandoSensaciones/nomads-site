nomads_listing.node_text_edit:
  path: '/node/{node}/edit/text'
  defaults:
    _controller: '\Drupal\nomads_listing\Controller\ListingFormModeEditController::editText'
    _title: 'Edit Listing (Text)'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node

nomads_listing.node_images_edit:
  path: '/node/{node}/edit/images'
  defaults:
    _controller: '\Drupal\nomads_listing\Controller\ListingFormModeEditController::editImages'
    _title: 'Edit Listing (Images)'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node

nomads_listing.node_offers_edit:
  path: '/node/{node}/edit/offers'
  defaults:
    _controller: '\Drupal\nomads_listing\Controller\ListingFormModeEditController::editOffers'
    _title: 'Edit Listing (Offers)'
  requirements:
    _entity_access: 'node.update'
  options:
    parameters:
      node:
        type: entity:node
