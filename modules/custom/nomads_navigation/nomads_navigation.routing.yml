nomads_navigation.settings:
  path: '/admin/config/search/nomads-navigation'
  defaults:
    _form: '\Drupal\nomads_navigation\Form\NomadsNavigationSettingsForm'
    _title: 'Nomads navigation'
  requirements:
    _permission: 'administer site configuration'

nomads_navigation.navbar_term_search:
  path: '/nomads-navigation/navbar-term-search'
  defaults:
    _controller: '\Drupal\nomads_navigation\Controller\NavbarTermSearchController::search'
  requirements:
    _access: 'TRUE'
