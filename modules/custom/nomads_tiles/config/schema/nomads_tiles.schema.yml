field.formatter.settings.nomads_tiles_media:
  type: mapping
  label: 'Nomads Tiles formatter settings'
  mapping:
    pattern_1d:
      type: string
      label: 'Pattern for 1 data tile'
    pattern_2d:
      type: string
      label: 'Pattern for 2 data tiles'
    pattern_3d:
      type: string
      label: 'Pattern for 3 data tiles'
    min_total_tiles:
      type: integer
      label: 'Minimum total tiles'
    max_total_tiles:
      type: integer
      label: 'Maximum total tiles'

field_group.field_group_formatter_plugin.nomads_data_tile:
  type: field_group.field_group_formatter_plugin.base
  label: 'Mapping for the Nomads data tile formatter settings'
  mapping:
    show_label:
      type: boolean
      label: 'Show label'
