domain_menu_access.settings:
  type: config_object
  mapping:
    menu_enabled:
      type: sequence
      label: 'Menu enabled'
      sequence:
        type: string
block.settings.domain_access_menu_block:*:
  type: block_settings
  label: 'Menu block'
  mapping:
    level:
      type: integer
      label: 'Starting level'
    depth:
      type: integer
      label: 'Maximum number of levels'
    expand_all_items:
      type: boolean
      label: 'Expand all items'
block.settings.domain_access_menu_menu_block:*:
  type: block_settings
  label: 'Menu block'
  mapping:
    follow:
      type: boolean
      label: 'The initial visibility level follows the active menu item'
    follow_parent:
      type: string
      label: 'Set initial visibility level to the active menu item, or its children'
    label_link:
      type: boolean
      label: 'If the block label should be a link'
    label_type:
      type: string
      label: 'Label type'
    level:
      type: integer
      label: 'Starting level'
    depth:
      type: integer
      label: 'Maximum number of levels'
    expand_all_items:
      type: boolean
      label: 'Expand all items'
    parent:
      type: string
      label: 'Parent menu link'
    suggestion:
      type: string
      label: 'Theme suggestion'
